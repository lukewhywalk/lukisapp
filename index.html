<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Lukis</title>
  <meta name="description" content="Offline data logging with cloud sync. Export to CSV.">

  <!-- PWA -->
  <link rel="manifest" href="manifest.webmanifest">
  <meta name="theme-color" content="#2563eb">

  <!-- Home-screen app (iOS reads the apple-* variants) -->
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="Lukis">
  <link rel="apple-touch-icon" href="apple-touch-icon.png">
  <link rel="icon" href="icon.svg" type="image/svg+xml">

  <style>
    * { box-sizing: border-box; }
    /* An author display rule (e.g. .tabs) otherwise wins over the UA [hidden]
       rule, so the hidden attribute silently stops working. Make it stick. */
    [hidden] { display: none !important; }
    :root {
      --bg:#f1f5f9; --surface:#fff; --text:#0f172a; --muted:#64748b;
      --primary:#2563eb; --primary-press:#1d4ed8; --danger:#dc2626;
      --border:#e2e8f0; --radius:14px;
      --safe-top: env(safe-area-inset-top); --safe-bottom: env(safe-area-inset-bottom);
    }
    html, body { margin:0; padding:0; }
    body {
      font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;
      background:var(--bg); color:var(--text); line-height:1.4;
      -webkit-font-smoothing:antialiased;
    }
    .app-header {
      position:sticky; top:0; z-index:10;
      background:var(--primary); color:#fff;
      padding:calc(10px + var(--safe-top)) 16px 10px;
      display:flex; align-items:center; justify-content:space-between; gap:12px;
      box-shadow:0 1px 4px rgba(0,0,0,.12);
    }
    .app-header h1 { font-size:20px; margin:0; font-weight:700; letter-spacing:.2px; }
    .tabs { display:flex; gap:4px; background:rgba(255,255,255,.18); padding:3px; border-radius:999px; }
    .tab {
      border:none; background:transparent; color:#fff; font-weight:600; font-size:14px;
      padding:6px 16px; border-radius:999px; cursor:pointer; font-family:inherit;
    }
    .tab.is-active { background:#fff; color:var(--primary); }
    .container { max-width:560px; margin:0 auto; padding:16px 16px calc(24px + var(--safe-bottom)); }
    .view[hidden] { display:none; }
    .card { background:var(--surface); border:1px solid var(--border); border-radius:var(--radius); padding:16px; margin-bottom:16px; }
    .card-title { font-size:18px; margin:0 0 6px; }
    .field { margin-bottom:14px; }
    .field label { display:block; font-size:14px; font-weight:600; margin-bottom:6px; }
    .field .req { color:var(--danger); margin-left:2px; }
    input, select, textarea {
      width:100%; font-size:16px; /* 16px keeps iOS from auto-zooming on focus */
      padding:12px; border:1px solid var(--border); border-radius:10px;
      background:#fff; color:var(--text); font-family:inherit;
    }
    textarea { min-height:84px; resize:vertical; }
    input:focus, select:focus, textarea:focus {
      outline:none; border-color:var(--primary); box-shadow:0 0 0 3px rgba(37,99,235,.15);
    }
    .field.checkbox { display:flex; align-items:center; gap:10px; }
    .field.checkbox input { width:20px; height:20px; }
    .field.checkbox label { margin:0; }
    .form-actions { display:flex; flex-direction:column; gap:8px; margin-top:4px; }
    .btn { font-size:16px; font-weight:600; border:none; border-radius:10px; padding:13px 16px; cursor:pointer; font-family:inherit; }
    .btn-primary { width:100%; background:var(--primary); color:#fff; min-height:50px; }
    .btn-primary:active { background:var(--primary-press); }
    .btn-primary:disabled { opacity:.6; cursor:default; }
    .btn-secondary { background:#eef2ff; color:var(--primary); }
    .btn-ghost { background:transparent; color:var(--muted); }
    .btn-ghost-danger { background:transparent; color:var(--danger); }
    .cat-grid { display:grid; grid-template-columns:1fr 1fr; gap:10px; margin-top:8px; }
    .cat-btn {
      border:none; border-radius:12px; background:var(--primary); color:#fff;
      font-size:18px; font-weight:700; font-family:inherit; padding:24px 12px; cursor:pointer;
      min-height:88px; box-shadow:0 1px 2px rgba(0,0,0,.08);
    }
    .cat-btn:active { background:var(--primary-press); transform:translateY(1px); }
    .list-head { display:flex; align-items:center; justify-content:space-between; gap:12px; margin-bottom:8px; }
    .recent-actions { display:flex; gap:8px; }
    .recent-list { list-style:none; margin:0; padding:0; }
    .date-group { list-style:none; }
    .date-header {
      display:flex; align-items:center; gap:8px; width:100%;
      background:none; border:none; cursor:pointer; font-family:inherit; text-align:left;
      font-size:12px; font-weight:700; color:var(--muted); text-transform:uppercase; letter-spacing:.04em;
      padding:16px 0 6px;
    }
    .date-group:first-child .date-header { padding-top:2px; }
    .date-caret { font-size:9px; transition:transform .15s; }
    .date-header[aria-expanded="false"] .date-caret { transform:rotate(-90deg); }
    .date-count { margin-left:auto; font-variant-numeric:tabular-nums; }
    .date-rows { list-style:none; margin:0; padding:0; }
    .entry-row { display:flex; align-items:center; gap:10px; padding:8px 0; }
    .entry-row + .entry-row { border-top:1px solid var(--border); }
    .entry-row .time { color:var(--muted); font-size:13px; font-variant-numeric:tabular-nums; flex:none; }
    .entry-row .cat { color:var(--muted); font-size:13px; flex:1; min-width:0; overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }
    .entry-actions { display:flex; align-items:center; gap:2px; flex:none; }
    .entry-edit { background:none; border:none; color:var(--muted); font-size:18px; line-height:1; cursor:pointer; padding:4px 8px; }
    .entry-edit:active { color:var(--primary); }
    .entry-del { background:none; border:none; color:var(--muted); font-size:22px; line-height:1; cursor:pointer; padding:2px 6px; }
    .entry-del:active { color:var(--danger); }
    .stats-year { display:flex; align-items:baseline; justify-content:space-between; gap:12px; margin-bottom:10px; }
    .stats-year h2 { font-size:18px; margin:0; }
    .table-wrap { overflow-x:auto; }
    .stats-table { width:100%; border-collapse:collapse; font-size:14px; }
    .stats-table th, .stats-table td { padding:7px 5px; text-align:right; font-variant-numeric:tabular-nums; white-space:nowrap; }
    .stats-table th:first-child, .stats-table td:first-child { text-align:left; }
    .stats-table thead th {
      font-size:11px; font-weight:700; color:var(--muted);
      text-transform:uppercase; letter-spacing:.03em; border-bottom:1px solid var(--border);
    }
    .stats-table tbody tr + tr td { border-top:1px solid var(--border); }
    .stats-table .col-total { font-weight:600; }
    .stats-table .total-row td { font-weight:700; border-top:2px solid var(--border); }
    .stats-table .zero { color:var(--muted); }
    .account { display:flex; align-items:center; justify-content:space-between; gap:12px; margin-top:14px; padding-top:14px; border-top:1px solid var(--border); }
    .account .btn-ghost { width:auto; padding:8px 10px; }
    .muted { color:var(--muted); font-size:14px; }
    .toast {
      position:fixed; left:50%; bottom:calc(20px + var(--safe-bottom));
      transform:translateX(-50%) translateY(20px);
      background:#0f172a; color:#fff; padding:11px 18px; border-radius:999px; font-size:14px;
      opacity:0; pointer-events:none; transition:opacity .2s, transform .2s; z-index:50; max-width:90%;
    }
    .toast.show { opacity:1; transform:translateX(-50%) translateY(0); }

    /* Four tabs no longer fit beside the title on a phone -- give them a row. */
    @media (max-width:460px) {
      .app-header { flex-wrap:wrap; }
      .tabs { flex:1 1 100%; }
      .tab { flex:1; padding:6px 8px; font-size:13px; }
    }

    /* ---------------------------- Invoice form --------------------------- */
    .inv-input { width:100%; border-collapse:collapse; margin-bottom:14px; }
    .inv-input th { font-size:11px; text-transform:uppercase; letter-spacing:.03em; color:var(--muted); text-align:left; padding-bottom:6px; }
    .inv-input th:not(:first-child), .inv-input td:not(:first-child) { width:88px; padding-left:8px; }
    .inv-input td { padding-bottom:8px; font-size:14px; }
    .inv-input input { padding:9px 10px; }

    /* --------------------- Invoice sheet: screen + print ------------------ */
    .sheet-preview { overflow-x:auto; padding-bottom:8px; }
    .sheet { width:210mm; margin:0 auto; color:#000; font-family:Helvetica,Arial,sans-serif; }
    .page {
      width:210mm; height:297mm; background:#fff; overflow:hidden;
      display:flex; flex-direction:column; box-shadow:0 1px 6px rgba(0,0,0,.15);
    }
    .page + .page { margin-top:8mm; }
    /* The payment part sits flush with the bottom edge of its own page. */
    .page-bill { justify-content:flex-end; }
    .sheet-body { flex:1; padding:18mm 20mm 6mm; font-size:10pt; line-height:1.35; }
    .inv-top { display:flex; justify-content:space-between; gap:10mm; }
    .inv-meta { text-align:right; white-space:nowrap; }
    .inv-title { font-size:20pt; letter-spacing:.06em; margin:14mm 0 8mm; }
    .inv-label { font-size:8pt; font-weight:700; letter-spacing:.08em; margin:0 0 1mm; }
    .inv-to { margin:0 0 10mm; }
    .inv-subject { margin:0 0 4mm; }
    .inv-items { width:100%; border-collapse:collapse; }
    .inv-items th, .inv-items td { padding:2mm 1mm; text-align:left; }
    .inv-items .num { text-align:right; white-space:nowrap; }
    .inv-items thead th { font-size:8pt; letter-spacing:.06em; border-bottom:.4mm solid #000; }
    .inv-items tbody td { border-bottom:.1mm solid #bbb; }
    .inv-items .sum td { border-top:.3mm solid #000; border-bottom:none; padding-top:3mm; }
    .inv-items .grand td { font-weight:700; border-top:.2mm solid #000; border-bottom:none; }
    .inv-foot { margin-top:12mm; font-size:9pt; }
    .inv-foot p { margin:0 0 3mm; }

    /* QR-bill: 210 x 105 mm, receipt 62 mm, payment part 148 mm. */
    .qrbill { height:105mm; display:flex; border-top:.2mm dashed #000; color:#000; }
    .qrbill p { margin:0; }
    .qr-receipt { width:62mm; padding:5mm; border-right:.2mm dashed #000; display:flex; flex-direction:column; }
    .qr-payment { width:148mm; padding:5mm; display:flex; gap:5mm; }
    .qr-left { width:51mm; }
    .qr-right { width:87mm; }
    .qrbill .qr-title { font-size:11pt; font-weight:700; margin-bottom:3mm; }
    .qrbill .qr-h-s { font-size:6pt; font-weight:700; line-height:9pt; margin-top:2mm; }
    .qrbill .qr-v-s { font-size:8pt; line-height:9pt; }
    .qrbill .qr-h-p { font-size:8pt; font-weight:700; line-height:11pt; margin-top:2mm; }
    .qrbill .qr-v-p { font-size:10pt; line-height:11pt; }
    .qr-amount { display:flex; gap:6mm; margin-top:2mm; }
    .qrbill .qr-accept { font-size:6pt; font-weight:700; text-align:right; margin-top:auto; }
    .qr-code { margin:5mm 0; }
    .qr-code svg { display:block; width:46mm; height:46mm; }

    @media print {
      @page { size:A4; margin:0; }
      html, body { background:#fff; margin:0; padding:0; }
      .app-header, #view-loading, #view-auth, #view-log, #view-all, #view-stats,
      #invoice-form, .toast { display:none !important; }
      .container { max-width:none; margin:0; padding:0; }
      #view-invoice { display:block !important; }
      .sheet-preview { overflow:visible; padding:0; }
      .sheet { width:210mm; margin:0; }
      .page { box-shadow:none; margin:0; }
      .page + .page { margin-top:0; break-before:page; page-break-before:always; }
    }
  </style>
</head>
<body>
  <header class="app-header">
    <h1>Lukis</h1>
    <nav class="tabs" id="tabs" role="tablist" hidden>
      <button class="tab is-active" type="button" data-view="log" role="tab">Log</button>
      <button class="tab" type="button" data-view="all" role="tab">All</button>
      <button class="tab" type="button" data-view="stats" role="tab">Stats</button>
      <button class="tab" type="button" data-view="invoice" role="tab">Invoice</button>
    </nav>
  </header>

  <main class="container">
    <!-- Shown until Firebase reports whether someone is signed in -->
    <section id="view-loading" class="view">
      <div class="card"><p class="muted">Loading…</p></div>
    </section>

    <!-- Sign-in: Google -->
    <section id="view-auth" class="view" hidden>
      <div class="card">
        <h2 class="card-title">Sign in</h2>
        <p class="muted">Sign in with your Google account to sync your bookings across devices.</p>
        <button type="button" id="google-signin-btn" class="btn btn-primary">Sign in with Google</button>
        <p id="signin-status" class="muted" aria-live="polite"></p>
      </div>
    </section>

    <!-- Log view: tap a category to book it; edit an existing booking in place -->
    <section id="view-log" class="view" hidden>
      <!-- Quick booking: optional remark, then one tap on a category -->
      <div class="card" id="quickbook">
        <div class="field">
          <label for="book-datetime">Date &amp; time</label>
          <input id="book-datetime" type="datetime-local">
        </div>
        <div class="field">
          <label for="glider">Glider</label>
          <select id="glider"></select>
        </div>
        <div class="field">
          <label for="remark">Remark</label>
          <input id="remark" type="text" autocomplete="off" placeholder="Optional, applied to the next booking">
        </div>
        <!-- Category buttons are rendered from CATEGORIES in app.js -->
        <div class="cat-grid" id="cat-grid"></div>
      </div>

      <!-- Edit an existing booking -->
      <div class="card" id="editcard" hidden>
        <h2 class="card-title">Edit booking</h2>
        <form id="edit-form">
          <div class="field">
            <label for="edit-datetime">Date &amp; time</label>
            <input id="edit-datetime" type="datetime-local">
          </div>
          <div class="field">
            <label for="edit-category">Category</label>
            <select id="edit-category"></select>
          </div>
          <div class="field">
            <label for="edit-glider">Glider</label>
            <select id="edit-glider"></select>
          </div>
          <div class="field">
            <label for="edit-remark">Remark</label>
            <input id="edit-remark" type="text" autocomplete="off">
          </div>
          <div class="form-actions">
            <button type="submit" class="btn btn-primary">Update</button>
            <button type="button" id="edit-cancel" class="btn btn-ghost">Cancel</button>
          </div>
        </form>
      </div>
    </section>

    <!-- All view: full list with per-entry edit and delete, export, and account -->
    <section id="view-all" class="view" hidden>
      <div class="card">
        <div class="list-head">
          <span id="count" class="muted"></span>
          <div class="recent-actions">
            <button id="export-btn" type="button" class="btn btn-secondary">Export</button>
            <button id="clear-btn" type="button" class="btn btn-ghost-danger" title="Delete all entries">Clear</button>
          </div>
        </div>
        <ul id="entry-list" class="recent-list"></ul>
        <p id="empty-note" class="muted">No entries yet.</p>
        <div class="account">
          <span id="account-email" class="muted"></span>
          <button id="signout-btn" type="button" class="btn btn-ghost">Sign out</button>
        </div>
      </div>
    </section>
    <!-- Invoice view: monthly bill for PGI, with a Swiss QR-bill payment part -->
    <section id="view-invoice" class="view" hidden>
      <div class="card" id="invoice-form">
        <h2 class="card-title">Monatsrechnung</h2>
        <div class="field">
          <label for="inv-month">Monat</label>
          <select id="inv-month"></select>
        </div>
        <div class="field">
          <label for="inv-date">Rechnungsdatum</label>
          <input id="inv-date" type="date">
        </div>
        <!-- Counts come from the bookings; F+V is not logged and is typed in -->
        <table class="inv-input">
          <thead>
            <tr><th>Position</th><th>Anzahl</th><th>Preis</th></tr>
          </thead>
          <tbody>
            <tr>
              <td><label for="inv-count-bigblue">Big Blue</label></td>
              <td><input id="inv-count-bigblue" type="number" min="0" step="1" value="0"></td>
              <td><input id="inv-price-bigblue" type="number" min="0" step="0.05" value="100"></td>
            </tr>
            <tr>
              <td><label for="inv-count-doubleair">Double Air</label></td>
              <td><input id="inv-count-doubleair" type="number" min="0" step="1" value="0"></td>
              <td><input id="inv-price-doubleair" type="number" min="0" step="0.05" value="170"></td>
            </tr>
            <tr>
              <td><label for="inv-count-fv">F+V</label></td>
              <td><input id="inv-count-fv" type="number" min="0" step="1" value="0"></td>
              <td><input id="inv-price-fv" type="number" min="0" step="0.05" value="33"></td>
            </tr>
          </tbody>
        </table>
        <div class="form-actions">
          <button id="inv-build" type="button" class="btn btn-primary">Rechnung erstellen</button>
          <button id="inv-print" type="button" class="btn btn-secondary" hidden>Drucken / Als PDF speichern</button>
        </div>
      </div>
      <div class="sheet-preview"><div id="inv-sheet"></div></div>
    </section>

    <!-- Stats view: bookings per month and year, split by category -->
    <section id="view-stats" class="view" hidden>
      <!-- One card per year, rendered from the same snapshot as the list -->
      <div id="stats-body"></div>
      <div class="card" id="stats-empty">
        <p class="muted">No entries yet.</p>
      </div>
    </section>
  </main>

  <div id="toast" class="toast" role="status" aria-live="polite"></div>

  <script type="module" src="app.js"></script>
</body>
</html>
